name: Ejecutar sku getter

on:
  workflow_dispatch:
    inputs:
      start_index:
        description: Número del producto desde el que empezar (comienza en 1)
        required: true
        type: number
        default: 1
      product_count:
        description: Cantidad de productos que se deben procesar
        required: true
        type: number
        default: 10

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Construir proyecto
        run: dotnet build SkuGetter/SkuGetter.csproj --configuration Release

      - name: Instalar Chromium y dependencias
        run: pwsh ./SkuGetter/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Ejecutar sku getter
        run: dotnet run --no-build --configuration Release --project SkuGetter.csproj -- ${{ inputs.start_index }} ${{ inputs.product_count }} 
        working-directory: SkuGetter

      - name: Publicar resultado
        uses: actions/upload-artifact@v4
        with:
          name: productos_completos
          path: SkuGetter/productos_completos_*.json
          if-no-files-found: error
