name: Ejecutar scraper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Construir proyecto
        run: dotnet build InitialInfoScraper/InitialInfoScraper.csproj --configuration Release

      - name: Instalar Chromium y dependencias
        run: pwsh ./InitialInfoScraper/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Ejecutar scraper
        run: dotnet run --no-build --configuration Release --project InitialInfoScraper/InitialInfoScraper.csproj
        working-directory: InitialInfoScraper

      - name: Publicar productos.json
        uses: actions/upload-artifact@v4
        with:
          name: productos
          path: InitialInfoScraper/productos.json
          if-no-files-found: error
